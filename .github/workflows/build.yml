name: Build ZT740 Turnip

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Turnip ARM64
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "34"
      NDK_VERSION: "29.0.14206865"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-mako \
            ninja-build \
            flex \
            bison \
            pkg-config \
            glslang-tools \
            zip \
            unzip \
            ccache \
            clang \
            lld \
            patchelf \
            file \
            binutils

      - name: Install Meson
        run: |
          python3 -m pip install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"

      - name: Clone Mesa
        run: |
          git clone \
            --depth=1 \
            -b main \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa

          cd mesa

          echo "MESA COMMIT:"
          git rev-parse HEAD

      - name: Setup NDK toolchain
        run: |

          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"

          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"

          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"

          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"

          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"

          echo "OBJDUMP=$TOOLCHAIN/bin/llvm-objdump" >> "$GITHUB_ENV"

          echo "OBJCOPY=$TOOLCHAIN/bin/llvm-objcopy" >> "$GITHUB_ENV"

          echo "LDFLAGS=-fuse-ld=lld" >> "$GITHUB_ENV"

      - name: Create cross file
        run: |

          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          cat > android-aarch64.txt <<EOF

          [binaries]

          ar = '$TOOLCHAIN/bin/llvm-ar'

          c = ['ccache', '$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang']

          cpp = [
            'ccache',
            '$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++',
            '-fno-exceptions',
            '-fno-unwind-tables',
            '-fno-asynchronous-unwind-tables',
            '--start-no-unused-arguments',
            '-static-libstdc++',
            '--end-no-unused-arguments'
          ]

          c_ld = '$TOOLCHAIN/bin/ld.lld'

          cpp_ld = '$TOOLCHAIN/bin/ld.lld'

          strip = '$TOOLCHAIN/bin/llvm-strip'

          pkg-config = [
            'env',
            'PKG_CONFIG_LIBDIR=$TOOLCHAIN/pkg-config',
            '/usr/bin/pkg-config'
          ]

          [host_machine]

          system = 'android'

          cpu_family = 'aarch64'

          cpu = 'armv8'

          endian = 'little'

          EOF

      - name: Create native file
        run: |

          cat > native.txt <<EOF

          [binaries]

          c = ['ccache', 'clang']

          cpp = ['ccache', 'clang++']

          ar = 'llvm-ar'

          strip = 'llvm-strip'

          c_ld = 'ld.lld'

          cpp_ld = 'ld.lld'

          [build_machine]

          system = 'linux'

          cpu_family = 'x86_64'

          cpu = 'x86_64'

          endian = 'little'

          EOF

      - name: Configure Mesa
        working-directory: mesa

        run: |

          meson setup build-android-aarch64 \
            --cross-file ../android-aarch64.txt \
            --native-file ../native.txt \
            --prefix /tmp/zt740 \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dvideo-codecs= \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dandroid-libbacktrace=disabled

      - name: Build Turnip
        working-directory: mesa

        run: |

          ninja \
            -C build-android-aarch64 \
            install

      - name: Verify driver
        run: |

          DRIVER="/tmp/zt740/lib/libvulkan_freedreno.so"

          if [ ! -f "$DRIVER" ]; then

            echo "DRIVER NOT FOUND"

            find /tmp/zt740 -type f || true

            exit 1

          fi

          echo "===== DRIVER ====="

          ls -lh "$DRIVER"

          echo "===== FILE ====="

          file "$DRIVER"

          echo "===== ELF ====="

          readelf -h "$DRIVER"

          echo "===== SONAME ====="

          readelf -d "$DRIVER" | grep SONAME || true

          echo "===== NEEDED ====="

          readelf -d "$DRIVER" | grep NEEDED || true

      - name: Create driver package
        run: |

          mkdir -p release

          cp \
            /tmp/zt740/lib/libvulkan_freedreno.so \
            release/libvulkan_freedreno.so

          MESA_HASH=$(cd mesa && git rev-parse --short HEAD)

          cat > release/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "ZT740 BASE v0.3",
            "description": "Upstream Mesa Turnip for Snapdragon 8 Gen 2 / Adreno 740",
            "author": "blackorange-sketch",
            "packageVersion": "3",
            "vendor": "Mesa",
            "driverVersion": "Mesa-${MESA_HASH}",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          cd release

          zip -9 \
            ../ZT740-BASE-v0.3.zip \
            libvulkan_freedreno.so \
            meta.json

      - name: Verify package
        run: |

          unzip -l ZT740-BASE-v0.3.zip

      - name: Upload driver
        uses: actions/upload-artifact@v4

        with:
          name: ZT740-BASE-v0.3
          path: ZT740-BASE-v0.3.zip
          if-no-files-found: error
