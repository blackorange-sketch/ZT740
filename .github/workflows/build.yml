name: Build ZT740 BASE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Turnip ARM64
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "34"
      NDK_VERSION: "29.0.14206865"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-mako \
            meson \
            ninja-build \
            flex \
            bison \
            pkg-config \
            glslang-tools \
            zip \
            unzip \
            ccache \
            clang \
            lld

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"

      - name: Clone Mesa
        run: |
          git clone --depth=1 \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa

      - name: Show Mesa revision
        working-directory: mesa
        run: |
          echo "Mesa revision:"
          git rev-parse HEAD

      - name: Create Android cross file
        run: |
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$TOOLCHAIN/bin/llvm-ar'
          c = '$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++'
          strip = '$TOOLCHAIN/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Configure Mesa
        working-directory: mesa
        run: |
          meson setup build-android-aarch64 \
            --cross-file ../android-aarch64.txt \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl

      - name: Build Turnip
        working-directory: mesa
        run: |
          meson compile -C build-android-aarch64

      - name: Find Turnip library
        run: |
          find mesa/build-android-aarch64 \
            -name "libvulkan_freedreno.so" \
            -print

      - name: Create driver package
        run: |
          mkdir -p release

          DRIVER=$(find mesa/build-android-aarch64 \
            -name "libvulkan_freedreno.so" \
            | head -n 1)

          if [ -z "$DRIVER" ]; then
            echo "ERROR: Turnip library not found"
            exit 1
          fi

          cp "$DRIVER" \
            release/vulkan.turnip.so

          MESA_HASH=$(cd mesa && git rev-parse --short HEAD)

          cat > release/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "ZT740 BASE v0.1",
            "description": "Upstream Mesa Turnip baseline for Adreno 740",
            "author": "blackorange-sketch",
            "packageVersion": "0.1",
            "vendor": "Mesa",
            "mesaCommit": "${MESA_HASH}",
            "minApi": 28,
            "libraryName": "vulkan.turnip.so"
          }
          EOF

          cd release

          zip -9 \
            ../ZT740-BASE-v0.1.zip \
            vulkan.turnip.so \
            meta.json

      - name: Upload ZT740 driver
        uses: actions/upload-artifact@v4
        with:
          name: ZT740-BASE-v0.1
          path: ZT740-BASE-v0.1.zip
          if-no-files-found: error

