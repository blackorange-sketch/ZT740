name: Build ZT740 Turnip (Eden)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Turnip ARM64 (ZT740)
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "28"
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-mako \
            ninja-build \
            flex \
            bison \
            pkg-config \
            glslang-tools \
            zip \
            unzip \
            ccache \
            file \
            binutils \
            llvm \
            curl \
            patchelf

      - name: Install Meson
        run: |
          python3 -m pip install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          meson --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turnip-zt740-${{ runner.os }}
          max-size: 2G

      - name: Clone Mesa
        run: |
          set -e
          if git clone --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git mesa; then
            echo "Clone OK"
          else
            echo "GitLab down, using archive"
            curl -L --retry 5 --retry-delay 5 -o mesa-main.tar.gz \
              "https://gitlab.freedesktop.org/mesa/mesa/-/archive/main/mesa-main.tar.gz"
            mkdir mesa
            tar -xzf mesa-main.tar.gz --strip-components=1 -C mesa
            rm -f mesa-main.tar.gz
          fi

          cd mesa
          if [ -d .git ]; then
            git rev-parse --short HEAD | tee ../mesa_commit.txt
          else
            echo "archive" > ../mesa_commit.txt
          fi

      - name: Create Android cross file
        run: |
          set -euo pipefail

          NDK_PATH="\( {ANDROID_HOME}/ndk/ \){NDK_VERSION}"
          TOOLCHAIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG="\( {TOOLCHAIN}/bin/aarch64-linux-android \){{ env.ANDROID_API }}-clang"
          CLANGXX="\( {TOOLCHAIN}/bin/aarch64-linux-android \){{ env.ANDROID_API }}-clang++"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_PATH=$NDK_PATH"
          echo "CLANG=$CLANG"

          test -f "$CLANG"
          test -f "$CLANGXX"

          cat > android-aarch64.txt << EOF
          [binaries]
          ar = '${TOOLCHAIN}/bin/llvm-ar'
          c = ['ccache', '${CLANG}']
          cpp = ['ccache', '${CLANGXX}']
          strip = '${TOOLCHAIN}/bin/llvm-strip'
          c_ld = 'lld'
          cpp_ld = 'lld'

          [built-in options]
          c_args = ['-O3', '-mcpu=cortex-x3', '-mtune=cortex-x3', '-march=armv8.5-a', '-fomit-frame-pointer', '-fno-plt']
          cpp_args = ['-O3', '-mcpu=cortex-x3', '-mtune=cortex-x3', '-march=armv8.5-a', '-fomit-frame-pointer', '-fno-plt']
          c_link_args = ['-fuse-ld=lld', '-static-libstdc++', '-Wl,-z,max-page-size=16384']
          cpp_link_args = ['-fuse-ld=lld', '-static-libstdc++', '-Wl,-z,max-page-size=16384']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

          cat android-aarch64.txt

      - name: Configure Mesa
        working-directory: mesa
        run: |
          meson setup build-android-aarch64 \
            --cross-file ../android-aarch64.txt \
            --prefix /tmp/zt740 \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Db_lto=false \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=${{ env.ANDROID_API }} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dxmlconfig=disabled \
            -Dlibunwind=disabled \
            -Dlmsensors=disabled \
            -Dmicrosoft-clc=disabled \
            -Dvalgrind=disabled \
            -Dvideo-codecs= \
            -Dbuild-tests=false \
            -Dtools=

      - name: Build Turnip
        working-directory: mesa
        run: |
          meson compile -C build-android-aarch64 -j"$(nproc)"
          meson install -C build-android-aarch64

      - name: Locate and verify driver
        id: locate
        run: |
          set -euo pipefail

          DRIVER="$(find /tmp/zt740 -name 'libvulkan_freedreno.so' -type f | head -n 1)"
          test -n "$DRIVER"

          echo "Found: $DRIVER"
          ls -lh "$DRIVER"
          file "$DRIVER"

          echo "===== NEEDED ====="
          readelf -d "$DRIVER" | grep NEEDED || true

          echo "===== ICD SYMBOLS ====="
          readelf --dyn-syms "$DRIVER" | grep -E "vk_icd|vkGetInstanceProcAddr" || true

          if file "$DRIVER" | grep -q "Android 34"; then
            echo "ERROR: still built for API 34"
            exit 1
          fi

          if readelf -d "$DRIVER" | grep NEEDED | grep -q "libc++_shared.so"; then
            echo "ERROR: dynamic libc++_shared.so (will not load in Eden)"
            exit 1
          fi

          if ! readelf --dyn-syms "$DRIVER" | grep -q "vk_icdGetInstanceProcAddr"; then
            echo "ERROR: missing vk_icdGetInstanceProcAddr"
            exit 1
          fi

          echo "driver_path=$DRIVER" >> "$GITHUB_OUTPUT"

      - name: Create package
        run: |
          set -euo pipefail

          mkdir -p release
          cp "${{ steps.locate.outputs.driver_path }}" release/libvulkan_freedreno.so

          MESA_HASH="$(cat mesa_commit.txt)"
          DATE="$(date -u +%Y%m%d)"

          cat > release/meta.json << EOF
          {
            "schemaVersion": 1,
            "name": "ZT740 Optimized",
            "description": "Optimized Mesa Turnip for Snapdragon 8 Gen 2 / Adreno 740 (Eden)",
            "author": "blackorange-sketch",
            "packageVersion": "1.0",
            "vendor": "Mesa",
            "driverVersion": "Mesa-${MESA_HASH}",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          cd release
          zip -9 "../ZT740-Optimized-\( {DATE}- \){MESA_HASH}.zip" \
            libvulkan_freedreno.so \
            meta.json

          unzip -l "../ZT740-Optimized-\( {DATE}- \){MESA_HASH}.zip"
          ls -lh ../ZT740-Optimized-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ZT740-Optimized
          path: ZT740-Optimized-*.zip
          if-no-files-found: error
