name: Build ZT740 BASE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Turnip ARM64
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "34"
      NDK_VERSION: "29.0.14206865"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-mako \
            ninja-build \
            flex \
            bison \
            pkg-config \
            glslang-tools \
            zip \
            unzip \
            ccache \
            patchelf \
            file \
            binutils

      - name: Install current Meson
        run: |
          python3 -m pip install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"

      - name: Clone Mesa
        run: |
          git clone \
            --depth=1 \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa

          cd mesa

          echo "Mesa commit:"
          git rev-parse HEAD

          echo "Mesa describe:"
          git describe --always || true

      - name: Create Android cross file
        run: |
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          cat > android-aarch64.txt <<EOF
          [binaries]
          ar = '$TOOLCHAIN/bin/llvm-ar'
          c = '$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++'
          c_ld = '$TOOLCHAIN/bin/ld.lld'
          cpp_ld = '$TOOLCHAIN/bin/ld.lld'
          strip = '$TOOLCHAIN/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Create native file
        run: |
          cat > native.txt <<EOF
          [binaries]
          c = 'clang'
          cpp = 'clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          c_ld = 'ld.lld'
          cpp_ld = 'ld.lld'

          [build_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Configure Mesa Turnip
        working-directory: mesa
        run: |
          meson setup build-android-aarch64 \
            --cross-file ../android-aarch64.txt \
            --native-file ../native.txt \
            --prefix /tmp/zt740-install \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms=android \
            -Dvideo-codecs= \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled

      - name: Build and install Turnip
        working-directory: mesa
        run: |
          ninja -C build-android-aarch64 install

      - name: Locate driver
        run: |
          DRIVER="/tmp/zt740-install/lib/libvulkan_freedreno.so"

          if [ ! -f "$DRIVER" ]; then
            echo "ERROR: Driver not found"

            echo "Searching:"
            find /tmp/zt740-install -type f || true
            find mesa/build-android-aarch64 \
              -name "libvulkan_freedreno.so" \
              -print || true

            exit 1
          fi

          echo "Driver found:"
          ls -lh "$DRIVER"

      - name: Inspect ELF
        run: |
          DRIVER="/tmp/zt740-install/lib/libvulkan_freedreno.so"

          echo "===== FILE ====="
          file "$DRIVER"

          echo "===== ELF HEADER ====="
          readelf -h "$DRIVER"

          echo "===== SONAME ====="
          readelf -d "$DRIVER" | grep SONAME || true

          echo "===== NEEDED LIBRARIES ====="
          readelf -d "$DRIVER" | grep NEEDED || true

          echo "===== UNDEFINED SYMBOLS ====="
          readelf -Ws "$DRIVER" \
            | grep UND \
            | head -n 100 \
            || true

      - name: Create AdrenoTools driver package
        run: |
          mkdir -p release

          DRIVER="/tmp/zt740-install/lib/libvulkan_freedreno.so"

          cp \
            "$DRIVER" \
            release/libvulkan_freedreno.so

          MESA_HASH=$(cd mesa && git rev-parse --short HEAD)

          cat > release/meta.json <<EOF
          {
            "schemaVersion": 1,
            "name": "ZT740 BASE v0.2",
            "description": "Upstream Mesa Turnip baseline for Snapdragon 8 Gen 2 / Adreno 740",
            "author": "blackorange-sketch",
            "packageVersion": "2",
            "vendor": "Mesa",
            "driverVersion": "Mesa-git-${MESA_HASH}",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          cd release

          zip -9 \
            ../ZT740-BASE-v0.2.zip \
            libvulkan_freedreno.so \
            meta.json

      - name: Verify ZIP contents
        run: |
          unzip -l ZT740-BASE-v0.2.zip

      - name: Upload ZT740 BASE
        uses: actions/upload-artifact@v4
        with:
          name: ZT740-BASE-v0.2
          path: ZT740-BASE-v0.2.zip
          if-no-files-found: error
