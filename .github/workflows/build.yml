name: Build ZT740 Turnip (Optimized)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Turnip ARM64 (ZT740)
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "34"
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-mako \
            ninja-build \
            flex \
            bison \
            pkg-config \
            glslang-tools \
            zip \
            unzip \
            ccache \
            file \
            binutils \
            llvm

      - name: Install Meson
        run: |
          python3 -m pip install --user --upgrade meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          meson --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turnip-zt740-${{ runner.os }}
          max-size: 2G

      - name: Clone Mesa
        run: |
          git clone --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git mesa
          cd mesa
          echo "Mesa commit: $(git rev-parse --short HEAD)"
          git rev-parse --short HEAD > ../mesa_commit.txt

      - name: Create Android cross file
        run: |
          NDK_PATH="\( {ANDROID_HOME}/ndk/ \){NDK_VERSION}"
          TOOLCHAIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG="\( {TOOLCHAIN}/bin/aarch64-linux-android \){ANDROID_API}-clang"
          CLANGXX="\( {TOOLCHAIN}/bin/aarch64-linux-android \){ANDROID_API}-clang++"

          echo "NDK_PATH = $NDK_PATH"
          echo "TOOLCHAIN = $TOOLCHAIN"
          echo "CLANG     = $CLANG"
          echo "CLANGXX   = $CLANGXX"

          if [ ! -f "$CLANG" ]; then
            echo "ERROR: Clang not found!"
            ls -la "${TOOLCHAIN}/bin/" | head -40 || true
            exit 1
          fi

          cat > android-aarch64.txt << 'CROSSFILE'
          [binaries]
          ar = 'TOOLCHAIN/bin/llvm-ar'
          c = ['ccache', 'CLANG']
          cpp = ['ccache', 'CLANGXX']
          strip = 'TOOLCHAIN/bin/llvm-strip'
          c_ld = 'TOOLCHAIN/bin/ld.lld'
          cpp_ld = 'TOOLCHAIN/bin/ld.lld'

          [built-in options]
          c_args = ['-O3', '-mcpu=cortex-x3', '-mtune=cortex-x3', '-march=armv8.5-a', '-fomit-frame-pointer', '-fno-plt', '-flto=thin']
          cpp_args = ['-O3', '-mcpu=cortex-x3', '-mtune=cortex-x3', '-march=armv8.5-a', '-fomit-frame-pointer', '-fno-plt', '-flto=thin']
          c_link_args = ['-fuse-ld=lld', '-flto=thin']
          cpp_link_args = ['-fuse-ld=lld', '-flto=thin']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          CROSSFILE

          # Підставляємо реальні шляхи
          sed -i "s|TOOLCHAIN|${TOOLCHAIN}|g" android-aarch64.txt
          sed -i "s|CLANG|${CLANG}|g" android-aarch64.txt
          sed -i "s|CLANGXX|${CLANGXX}|g" android-aarch64.txt

          echo "===== Final cross file ====="
          cat android-aarch64.txt

      - name: Configure Mesa
        working-directory: mesa
        run: |
          meson setup build-android-aarch64 \
            --cross-file ../android-aarch64.txt \
            --prefix /tmp/zt740 \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dvideo-codecs= \
            -Dbuild-tests=false \
            -Dtools=

      - name: Build Turnip
        working-directory: mesa
        run: |
          meson compile -C build-android-aarch64 -j$(nproc)
          meson install -C build-android-aarch64

      - name: Locate driver
        id: locate
        run: |
          DRIVER=$(find /tmp/zt740 -name "libvulkan_freedreno.so" -type f | head -n 1)

          if [ -z "$DRIVER" ]; then
            echo "Driver not found!"
            find /tmp/zt740 -type f || true
            find mesa/build-android-aarch64 -name "*freedreno*" || true
            exit 1
          fi

          echo "Found driver: $DRIVER"
          echo "driver_path=$DRIVER" >> $GITHUB_OUTPUT
          ls -lh "$DRIVER"
          file "$DRIVER"

      - name: Create package
        run: |
          mkdir -p release
          cp "${{ steps.locate.outputs.driver_path }}" release/libvulkan_freedreno.so

          MESA_HASH=$(cat mesa_commit.txt)
          DATE=$(date -u +%Y%m%d)

          cat > release/meta.json << EOF
          {
            "schemaVersion": 1,
            "name": "ZT740 Optimized",
            "description": "Optimized Mesa Turnip for Snapdragon 8 Gen 2 / Adreno 740 (Eden)",
            "author": "blackorange-sketch",
            "packageVersion": "1.0",
            "vendor": "Mesa",
            "driverVersion": "Mesa-${MESA_HASH}",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          EOF

          cd release
          zip -9 ../ZT740-Optimized-\( {DATE}- \){MESA_HASH}.zip libvulkan_freedreno.so meta.json

          echo "===== Package ====="
          ls -lh ../ZT740-Optimized-*.zip
          unzip -l ../ZT740-Optimized-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZT740-Optimized
          path: ZT740-Optimized-*.zip
          if-no-files-found: error
