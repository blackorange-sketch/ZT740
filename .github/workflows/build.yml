name: Build ZT740 Turnip (Eden)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: zt740-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Turnip ARM64 (ZT740)
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "28"
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-mako \
            ninja-build flex bison pkg-config glslang-tools \
            zip unzip ccache file binutils llvm curl patchelf

      - name: Install Meson
        run: |
          python3 -m pip install --user --upgrade meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: \( {{ env.ANDROID_HOME }}/ndk/ \){{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;$NDK_VERSION"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: turnip-zt740
          restore-keys: turnip-zt740
          max-size: 4G
          save: true

      - name: Clone Mesa
        run: |
          set -e
          if git clone --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git mesa; then
            echo Clone OK
          else
            curl -L --retry 5 --retry-delay 5 -o mesa-main.tar.gz \
              "https://gitlab.freedesktop.org/mesa/mesa/-/archive/main/mesa-main.tar.gz"
            mkdir mesa
            tar -xzf mesa-main.tar.gz --strip-components=1 -C mesa
            rm -f mesa-main.tar.gz
          fi
          cd mesa
          if [ -d .git ]; then
            git rev-parse --short HEAD > ../mesa_commit.txt
          else
            echo archive > ../mesa_commit.txt
          fi
          cat ../mesa_commit.txt

      - name: Patch symbol visibility
        run: |
          python3 - << 'PY'
          from pathlib import Path
          n = 0
          for p in Path("mesa").rglob("meson.build"):
              t = p.read_text(encoding="utf-8", errors="ignore")
              nt = t.replace("gnu_symbol_visibility : 'hidden'", "gnu_symbol_visibility : 'default'")
              nt = nt.replace("gnu_symbol_visibility: 'hidden'", "gnu_symbol_visibility: 'default'")
              if nt != t:
                  p.write_text(nt, encoding="utf-8")
                  n += 1
                  print("patched", p)
          print("files patched", n)
          PY

      - name: Create Android cross file
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path

          api = os.environ["ANDROID_API"]
          ndk_ver = os.environ["NDK_VERSION"]
          android_home = os.environ["ANDROID_HOME"]
          toolchain = Path(android_home) / "ndk" / ndk_ver / "toolchains/llvm/prebuilt/linux-x86_64"
          clang = toolchain / "bin" / f"aarch64-linux-android{api}-clang"
          clangxx = toolchain / "bin" / f"aarch64-linux-android{api}-clang++"
          print("CLANG", clang)
          if not clang.is_file():
              raise SystemExit("clang not found")

          Path("android-aarch64.txt").write_text(f"""
          [binaries]
          ar = '{toolchain}/bin/llvm-ar'
          c = ['ccache', '{clang}']
          cpp = ['ccache', '{clangxx}']
          strip = '{toolchain}/bin/llvm-strip'
          c_ld = 'lld'
          cpp_ld = 'lld'

          [built-in options]
          c_args = ['-O3', '-mcpu=cortex-x3', '-mtune=cortex-x3', '-march=armv8.5-a', '-fomit-frame-pointer', '-fno-plt', '-fvisibility=default']
          cpp_args = ['-O3', '-mcpu=cortex-x3', '-mtune=cortex-x3', '-march=armv8.5-a', '-fomit-frame-pointer', '-fno-plt', '-fvisibility=default']
          c_link_args = ['-fuse-ld=lld', '-static-libstdc++', '-Wl,-z,max-page-size=16384', '-Wl,--export-dynamic']
          cpp_link_args = ['-fuse-ld=lld', '-static-libstdc++', '-Wl,-z,max-page-size=16384', '-Wl,--export-dynamic']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          """.lstrip())
          print(Path("android-aarch64.txt").read_text())
          PY

      - name: Configure Mesa
        working-directory: mesa
        run: |
          meson setup build-android-aarch64 \
            --cross-file ../android-aarch64.txt \
            --prefix /tmp/zt740 \
            -Dbuildtype=release \
            -Db_ndebug=true \
            -Db_lto=false \
            -Dstrip=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=$ANDROID_API \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dxmlconfig=disabled \
            -Dlibunwind=disabled \
            -Dlmsensors=disabled \
            -Dmicrosoft-clc=disabled \
            -Dvalgrind=disabled \
            -Dvideo-codecs= \
            -Dbuild-tests=false \
            -Dtools=

      - name: Build Turnip
        working-directory: mesa
        run: |
          meson compile -C build-android-aarch64 --list | grep -i vulkan || true
          meson compile -C build-android-aarch64 vulkan_freedreno || meson compile -C build-android-aarch64
          ccache -s

      - name: Locate and verify driver
        run: |
          python3 - << 'PY'
          import subprocess, sys
          from pathlib import Path

          roots = [Path("mesa/build-android-aarch64"), Path("/tmp/zt740")]
          found = []
          for root in roots:
              if root.exists():
                  found += [p for p in root.rglob("libvulkan_freedreno.so") if p.is_file()]
          found = [p for p in found if ".p" not in p.parts]
          if not found:
              print("driver not found")
              sys.exit(1)

          driver = found[0]
          print("DRIVER", driver)
          file_out = subprocess.check_output(["file", str(driver)], text=True)
          print(file_out)

          needed = subprocess.check_output(["readelf", "-d", str(driver)], text=True)
          print("===== NEEDED =====")
          print("\n".join(l for l in needed.splitlines() if "NEEDED" in l))

          dyn = subprocess.check_output(["readelf", "--dyn-syms", "-W", str(driver)], text=True)
          print("===== DYNSYM vk =====")
          vk_dyn = "\n".join(l for l in dyn.splitlines() if "vk" in l.lower())
          print(vk_dyn[:5000] if vk_dyn else "(empty)")

          nm = subprocess.check_output(
              ["llvm-nm", "-D", "--defined-only", str(driver)],
              text=True,
              stderr=subprocess.STDOUT,
          )
          print("===== NM -D vk =====")
          vk_nm = "\n".join(l for l in nm.splitlines() if "vk" in l.lower())
          print(vk_nm[:5000] if vk_nm else "(empty)")

          if "Android 34" in file_out:
              print("ERROR: API 34")
              sys.exit(1)
          if "libc++_shared.so" in needed:
              print("ERROR: libc++_shared.so")
              sys.exit(1)

          exports = dyn + "\n" + nm
          if "vk_icdGetInstanceProcAddr" not in exports and "vkGetInstanceProcAddr" not in exports:
              print("ERROR: no Vulkan entry point")
              sys.exit(1)

          Path("driver_path.txt").write_text(str(driver))
          print("VERIFY OK")
          PY

      - name: Create package
        run: |
          python3 - << 'PY'
          import datetime, subprocess, zipfile
          from pathlib import Path

          driver = Path("driver_path.txt").read_text().strip()
          release = Path("release")
          release.mkdir(exist_ok=True)
          so = release / "libvulkan_freedreno.so"
          so.write_bytes(Path(driver).read_bytes())
          subprocess.check_call(["llvm-strip", "--strip-unneeded", str(so)])

          mesa_hash = Path("mesa_commit.txt").read_text().strip()
          date = datetime.datetime.utcnow().strftime("%Y%m%d")
          meta = release / "meta.json"
          meta.write_text(f'''{{
            "schemaVersion": 1,
            "name": "ZT740 Optimized",
            "description": "Optimized Mesa Turnip for Snapdragon 8 Gen 2 / Adreno 740 (Eden)",
            "author": "blackorange-sketch",
            "packageVersion": "1.0",
            "vendor": "Mesa",
            "driverVersion": "Mesa-{mesa_hash}",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }}
          ''')
          name = f"ZT740-Optimized-{date}-{mesa_hash}.zip"
          with zipfile.ZipFile(name, "w", zipfile.ZIP_DEFLATED) as z:
              z.write(so, "libvulkan_freedreno.so")
              z.write(meta, "meta.json")
          print("created", name)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ZT740-Optimized
          path: ZT740-Optimized-*.zip
          if-no-files-found: error
